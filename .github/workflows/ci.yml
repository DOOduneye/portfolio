name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:generate
      - name: schema.ts and migrations must agree
        run: |
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "schema.ts changed without a generated migration. Run: pnpm run db:generate"
            git status --porcelain migrations
            exit 1
          fi
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
